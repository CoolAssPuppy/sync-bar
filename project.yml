name: SyncBar
options:
  bundleIdPrefix: com.strategicnerds
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

packages:
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    from: "4.0.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: "3.0.0"
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.0.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_APP_SANDBOX: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 955GSY56UT
  configs:
    Debug:
      # Hardened runtime breaks XCTest's runtime injection into the host app.
      ENABLE_HARDENED_RUNTIME: NO
      # Xcode 15+ mergeable libraries split the host into "SyncBar" +
      # "SyncBar.debug.dylib" in Debug, but the test bundle's rpath
      # doesn't reach the host's MacOS directory so dlopen fails. Force a
      # statically merged Debug binary so `xcodebuild test` works.
      MERGED_BINARY_TYPE: manual
      MERGEABLE_LIBRARY: NO
    Release:
      ENABLE_HARDENED_RUNTIME: YES

targets:
  SyncBar:
    type: application
    platform: macOS
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    scheme:
      testTargets:
        - SyncBarTests
      gatherCoverageData: true
    sources:
      - path: Source
      - path: Images.xcassets
      - path: Resources
    dependencies:
      - package: KeychainAccess
      - package: Sparkle
      - package: PostHog
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.strategicnerds.SyncBar
        PRODUCT_NAME: "SyncBar"
        MARKETING_VERSION: "1.6.2"
        CURRENT_PROJECT_VERSION: "29"
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: SyncBar.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LS_MINIMUM_SYSTEM_VERSION: "14.0"
        COMBINE_HIDPI_IMAGES: YES
  SyncBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: SyncBar
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SyncBar.app/Contents/MacOS/SyncBar"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.strategicnerds.SyncBarTests
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
